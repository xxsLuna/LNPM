name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # One draft release, created before the build matrix fans out. Letting each platform job create
  # "the" release races: two of them can win, and the assets end up split across duplicate drafts
  # with a partial latest.json in each.
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Verify the tag matches the app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "tag=$tag package.json=$package tauri.conf.json=$tauri Cargo.toml=$cargo"
          # A release built from a mismatched tag publishes artifacts the updater will never offer,
          # because latest.json advertises the version compiled into the binary.
          if ($package -ne $tag -or $tauri -ne $tag -or $cargo -ne $tag) {
            throw "Tag $tag does not match package.json ($package), tauri.conf.json ($tauri) and Cargo.toml ($cargo)"
          }

      - name: Create the draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes come from the matching CHANGELOG section, so they can never describe an
          # older version than the one being built.
          awk -v heading="## $version - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md
          cat >> notes.md <<'FOOTER'

          ### Packages

          - Windows: NSIS executable and MSI installer
          - macOS: Apple Silicon and Intel disk images
          - Linux: AppImage and Debian package

          Updater artifacts are signed and verified by LNPM before installation. Platform
          code-signing is not yet enabled, so download assets only from this repository.

          LNPM v0.2.0 and later can install this release through the in-app updater. v0.1.0 has no
          updater and has to be replaced manually once.

          Project administrator: [@xxsLuna](https://github.com/xxsLuna)
          FOOTER
          # A draft is not addressable by tag, so an existing one has to be found in the list — but
          # a release created moments ago does not appear there yet, so a new one takes its id from
          # the creation response instead of from a follow-up query.
          #
          # Deleting and re-pushing a tag detaches the draft that was pointing at it: GitHub renames
          # its tag to "untagged-…", which is why the match also accepts the release name and why
          # the update below always writes the tag back.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\" or (.draft and .name == \"LNPM $GITHUB_REF_NAME\"))] | first | .id // empty")"
          if [ -n "$release_id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -f tag_name="$GITHUB_REF_NAME" -f name="LNPM $GITHUB_REF_NAME" \
              -F body=@notes.md -F draft=true --jq .id
          else
            release_id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="LNPM $GITHUB_REF_NAME" \
              -F body=@notes.md -F draft=true -F prerelease=false --jq .id)"
          fi
          test -n "$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  publish:
    name: Build ${{ matrix.label }}
    needs: prepare
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --ci --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: Linux x64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --ci --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --ci --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --ci --target x86_64-apple-darwin --bundles app,dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"
          }

      - name: Build and publish native packages
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the one draft prepared above rather than creating a release per platform.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  finalize:
    name: Publish verified release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify installers and updater metadata
        working-directory: release-assets
        run: |
          test -f latest.json
          test "$(find . -maxdepth 1 -type f -name '*.sig' | wc -l)" -ge 4
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) | grep -q .
          find . -maxdepth 1 -type f -name '*.AppImage' | grep -q .
          find . -maxdepth 1 -type f -name '*.deb' | grep -q .
          find . -maxdepth 1 -type f -name '*.dmg' | grep -q .
          jq -e '
            (.version | type == "string" and length > 0) and
            (.platforms | type == "object") and
            ([.platforms[] | select(
              (.url | type == "string" and length > 0) and
              (.signature | type == "string" and length > 0)
            )] | length >= 4)
          ' latest.json

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
