name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: --ci --target x86_64-pc-windows-msvc --bundles nsis,msi
          - label: Linux x64
            platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: --ci --target x86_64-unknown-linux-gnu --bundles appimage,deb
          - label: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --ci --target aarch64-apple-darwin --bundles app,dmg
          - label: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --ci --target x86_64-apple-darwin --bundles app,dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is required"
          }

      - name: Build and publish native packages
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: LNPM ${{ github.ref_name }}
          releaseBody: |
            Native installers for Live Network Ping Monitor.

            Highlights in v0.2.1:

            - Adds an explicit all-monitors view with combined metrics and equal chart emphasis
            - Polishes the dashboard, compact popup, chart tooltip and date-axis layout
            - Uses the cat-ear wireless logo across the app, native packages and status-aware tray icon
            - Groups simultaneous network-quality changes into a single native notification
            - Identifies [@xxsLuna](https://github.com/xxsLuna) as the project administrator

            - Windows: NSIS executable and MSI installer
            - macOS: Apple Silicon and Intel disk images
            - Linux: AppImage and Debian package

            Updater artifacts are signed and verified by LNPM before installation. Platform code-signing is not yet enabled, so download assets only from this repository.

            LNPM v0.1.0 does not include the updater and cannot update itself. Install v0.2.0 manually once; in-app updates work for releases after v0.2.0.

            LNPM v0.2.0 and later can install this release through the in-app updater.

            Project administrator: [@xxsLuna](https://github.com/xxsLuna)
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: false
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  finalize:
    name: Publish verified release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download release packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets

      - name: Verify installers and updater metadata
        working-directory: release-assets
        run: |
          test -f latest.json
          test "$(find . -maxdepth 1 -type f -name '*.sig' | wc -l)" -ge 4
          find . -maxdepth 1 -type f \( -name '*.exe' -o -name '*.msi' \) | grep -q .
          find . -maxdepth 1 -type f -name '*.AppImage' | grep -q .
          find . -maxdepth 1 -type f -name '*.deb' | grep -q .
          find . -maxdepth 1 -type f -name '*.dmg' | grep -q .
          jq -e '
            (.version | type == "string" and length > 0) and
            (.platforms | type == "object") and
            ([.platforms[] | select(
              (.url | type == "string" and length > 0) and
              (.signature | type == "string" and length > 0)
            )] | length >= 4)
          ' latest.json

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
