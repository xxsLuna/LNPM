[package]
name = "lnpm"
version = "0.2.0"
description = "Cross-platform live ICMP latency and network stability monitor"
authors = ["Minsang Cho"]
license = "MIT"
repository = "https://github.com/xxsLuna/LNPM"
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lnpm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
directories = "6"
parking_lot = "0.12"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
surge-ping = "0.8.4"
sys-locale = "0.3"
tauri = { version = "2.11", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2.5"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
